<title>SpellMaster Pro — Fix Your Spelling. One Mistake at a Time.</title>
<!--
  ============================================================================
  SpellMaster Pro — Single-file spelling & vocabulary learning platform
  ============================================================================
  OVERVIEW
    A complete, functional learning platform (not a quiz) built around:
      UNDERSTAND THE MISTAKE → PRACTICE THE PATTERN → REMEMBER → REDUCE ERRORS
    Full loop: Listen/Read → Recall → Type → Compare → Analyze error →
    Classify → Store attempt/mistake → Update error profile → Schedule SRS →
    Targeted practice → Master.

  FEATURES
    • Landing page, register/login, guest mode (auto-syncs on signup)
    • Dashboard: streak, daily goal, accuracy, mastered, need-review, insights
    • Practice modes: Listen&Type, Read&Type, Mistake Review, Daily Challenge,
      Timed Challenge, Quick, Category, Custom List, Error-Pattern practice
    • Spelling comparison engine: Levenshtein + alignment backtrace; detects
      missing/extra/wrong letter, transposition, double consonant/vowel,
      wrong ending/prefix, spacing, hyphenation, capitalization
    • Visual SpellingDiff component (accessible: shapes+text, not color alone)
    • Mistake database + "My Spelling Patterns" analytics (real user data only)
    • SM-2-inspired SRS, mastery requires sustained recall
    • Vocabulary library (search/filter/sort), word details, custom lists (CSV)
    • Progress charts (canvas), achievements, local leaderboard, settings
    • Admin: dashboard, vocabulary mgmt, categories, analytics,
      CSV import + PDF import (pdf.js, loaded on demand) with preview/approval,
      dedupe on re-import, needs_review flags
    • Web Speech API TTS (en-GB/en-US, speeds 0.6–1.2), graceful fallback
    • Data persisted in localStorage; session resumes after refresh

  INITIAL VOCABULARY
    Ships with a structured seed dataset of IELTS-Listening-oriented words
    organized by the categories from the source PDF. The REAL 1,200-word PDF
    should be imported via Admin → Import → PDF Import (admin login below).
    Imported records keep source attribution + needs_review flags.

  DEMO LOGINS (created on first run)
    Admin:  admin@spellmaster.app / admin123
    Demo:   demo@spellmaster.app  / demo123  (has sample history for charts)

  NOTES
    • Passwords live in localStorage — fine for a local single-file app;
      swap the auth layer for Supabase Auth in production.
    • Everything runs offline; PDF import needs internet once (pdf.js CDN).
  ============================================================================
-->
<style>
:root{--bg:#f5f6fa;--card:#ffffff;--text:#1a2233;--muted:#64708a;--line:#e4e7ef;--brand:#4f46e5;--brand-soft:#eef0ff;--ok:#16a34a;--ok-soft:#e8f7ee;--bad:#dc2626;--bad-soft:#fdecec;--warn:#d97706;--warn-soft:#fdf3e3;--r:14px;--sh:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06)}

html{-webkit-text-size-adjust:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);transition:.15s;min-height:38px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:14px 26px;font-size:16px;min-height:48px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip.new{background:var(--brand-soft);color:var(--brand)}
.chip.learning{background:var(--warn-soft);color:var(--warn)}
.chip.review{background:#e0f2fe;color:#0369a1}
.chip.difficult{background:var(--bad-soft);color:var(--bad)}
.chip.mastered{background:var(--ok-soft);color:var(--ok)}
.chip.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{padding:16px}
.stat .v{font-size:26px;font-weight:700;margin-top:2px}
.stat .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}

#app{min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;z-index:30}
.sidebar .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;padding:6px 8px 16px}

.searchres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);z-index:50;max-height:340px;overflow:auto}

.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px;z-index:50}

@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ============================ SPELLING ENGINE ============================ */
const ERRTYPES={
 missing_letter:"Missing Letter",extra_letter:"Extra Letter",wrong_letter:"Wrong Letter",transposition:"Transposition",
 double_consonant:"Double Consonant Error",double_vowel:"Double Vowel Error",wrong_ending:"Wrong Ending",
 wrong_prefix:"Wrong Prefix",spacing:"Spacing Error",hyphenation:"Hyphenation Error",capitalization:"Capitalization Error"
};
function levenshteinOps(a,b){ // ops transforming user string a into correct string b
 const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1),dp[i-1][j]+1,dp[i][j-1]+1);
 const ops=[];let i=m,j=n;
 while(i>0||j>0){
  if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ops.unshift({op:a[i-1]===b[j-1]?"match":"sub",ai:i-1,bj:j-1,aChar:a[i-1],bChar:b[j-1]});i--;j--}
  else if(i>0&&dp[i][j]===dp[i-1][j]+1){ops.unshift({op:"extra",ai:i-1,bj:null,aChar:a[i-1],bChar:null});i--}
  else{ops.unshift({op:"missing",ai:null,bj:j-1,aChar:null,bChar:b[j-1]});j--}
 }
 return{dist:dp[m][n],ops};
}
function analyzeSpelling(correctRaw,attemptRaw,opts={}){
 const strict=opts.strict!==false;
 const cR=String(correctRaw).trim(),aR=String(attemptRaw).trim();
 const strip=s=>s.toLowerCase().replace(/[\s\-–—_]/g,"");
 const notes=[];
 if(strip(cR)===strip(aR)){
  if(cR===aR)return{correct:true,editDistance:0,mistakes:[]};
  let issues=[];
  if(cR.toLowerCase()===aR.toLowerCase())issues.push({type:"capitalization"});
  else if((cR.match(/-/g)||[]).join("")!==(aR.match(/-/g)||[]).join(""))issues.push({type:"hyphenation"});
  else issues.push({type:"spacing"});
  const punctuationOnly=!strict; // flexible mode accepts punctuation/case variation
  return{correct:punctuationOnly,editDistance:1,mistakes:strict?issues.map(x=>({type:x.type,explanation:explain(x.type,cR,aR)})):[],notes:issues.map(x=>ERRTYPES[x.type])};
 }
 let c=cR.toLowerCase(),a=aR.toLowerCase();
 if(!strict){c=c.replace(/-/g," ");a=a.replace(/-/g," ")}
 const{dist,ops}=levenshteinOps(a,c);
 // transposition: single adjacent swap
 let transposed=-1;
 if(dist===2&&Math.abs(a.length-c.length)===0){
  for(let i=0;i<c.length-1;i++){if(c.slice(0,i)+c[i+1]+c[i]+c.slice(i+2)===a){transposed=i;break}}
 }
 const mistakes=[];
 if(transposed>=0){
  mistakes.push({type:"transposition",position:transposed,expected:c[transposed]+c[transposed+1],actual:a[transposed]+a[transposed+1],explanation:`You reversed the order of "${c[transposed]}" and "${c[transposed+1]}" — it should be "${c[transposed]}${c[transposed+1]}", not "${a[transposed]}${a[transposed+1]}".`});
 }else{
  const errPositions=ops.filter(o=>o.op!=="match").map(o=>o.bj??c.length);
  const minPos=Math.min(...errPositions,c.length),maxPos=Math.max(...errPositions,-1);
  const allAtEnd=maxPos>=c.length-3&&maxPos<c.length+1;
  const allAtStart=minPos<=2;
  for(const o of ops){
   if(o.op==="match")continue;
   let type;
   if(o.op==="missing"){
    const prevSame=o.bj>0&&c[o.bj-1]===o.bChar,nextSame=o.bj<c.length-1&&c[o.bj+1]===o.bChar;
    if(prevSame||nextSame)type=isVowel(o.bChar)?"double_vowel":"double_consonant";
    else type="missing_letter";
   }else if(o.op==="extra")type="extra_letter";
   else type="wrong_letter";
   if(type==="wrong_letter"&&allAtEnd&&c.length>=4)type="wrong_ending";
   if(type==="wrong_letter"&&allAtStart&&c.length>=4&&mistakes.every(m=>m.type!=="wrong_ending"))type="wrong_prefix";
   mistakes.push({type,position:o.bj??o.ai,expected:o.bChar,actual:o.aChar,explanation:explain(type,cR,aR,o)});
  }
 }
 const correct=mistakes.length===0;
 return{correct,editDistance:dist,mistakes};
}
function explain(type,c,a,o){
 switch(type){
  case"missing_letter":return`You missed the letter "${o?o.bChar:""}" — it's missing from your answer.`;
  case"extra_letter":return`You added an extra letter "${o?o.aChar:""}" that doesn't belong.`;
  case"wrong_letter":return`You substituted "${o?o.aChar:""}" for "${o?o.bChar:""}".`;
  case"transposition":return"You reversed the order of two adjacent letters.";
  case"double_consonant":return`You missed one of the repeated consonant characters ("${o?o.bChar:""}") — this word has a double consonant.`;
  case"double_vowel":return`You missed one of the repeated vowels ("${o?o.bChar:""}") — this word has a double vowel.`;
  case"wrong_ending":return"The ending of the word is incorrect — check the suffix.";
  case"wrong_prefix":return"The beginning of the word is incorrect — check the prefix.";
  case"spacing":return"Check the spacing between words.";
  case"hyphenation":return"Check the hyphenation — a hyphen is required (or placed differently).";
  case"capitalization":return"Check the capitalization.";
 }
 return"Spelling difference detected.";
}
/* visual diff tokens */
function diffTokens(correct,attempt,opts={}){
 const res=analyzeSpelling(correct,attempt,opts);
 if(res.correct&&res.mistakes.length===0)return{ok:true,rows:null};
 let c=correct.trim(),a=attempt.trim();
 const lc=c.toLowerCase(),la=a.toLowerCase();
 if(!opts.strict!==false){} // noop guard
 c=lc;a=la;
 if(!opts.strict){c=c.replace(/-/g," ");a=a.replace(/-/g," ")}
 const{ops}=levenshteinOps(a,c);
 const correctRow=[],userRow=[];
 for(const o of ops){
  if(o.op==="match"){correctRow.push({ch:o.bChar,st:"ok"});userRow.push({ch:o.aChar,st:"ok"})}
  else if(o.op==="missing"){correctRow.push({ch:o.bChar,st:"bad"});userRow.push({ch:"·",st:"miss"})}
  else if(o.op==="extra"){userRow.push({ch:o.aChar,st:"extra"})}
  else{correctRow.push({ch:o.bChar,st:"bad"});userRow.push({ch:o.aChar,st:"bad"})}
 }
 return{ok:false,correctRow,userRow,dist:res.editDistance};
}
function renderDiff(correct,attempt,opts={}){
 const t=diffTokens(correct,attempt,opts);
 if(t.ok)return`<div class="diff-row"><span class="diff-c ok" style="width:auto;padding:0 14px">${esc(correct)}</span></div>`;
 const row=r=>`<div class="diff-row" role="list">${r.map(x=>`<span class="diff-c ${x.st}" role="listitem" aria-label="${x.st==="miss"?"missing letter":x.st==="bad"?"wrong position":x.st==="extra"?"extra letter":x.ch}">${esc(x.ch)}</span>`).join("")}</div>`;
 return`<div class="small muted" style="margin-top:8px">Correct spelling:</div>${row(t.correctRow)}<div class="small muted" style="margin-top:8px">Your answer:</div>${row(t.userRow)}
 <div class="small muted" style="margin-top:8px">Legend: <span class="diff-c bad" style="display:inline-flex;width:auto;padding:0 8px">wrong / missing spot</span> <span class="diff-c miss" style="display:inline-flex;width:auto;padding:0 8px">· letter you missed</span> <span class="diff-c extra" style="display:inline-flex;width:auto;padding:0 8px">extra letter</span></div>`;
}

/* ============================ SRS ============================ */
const LADDER=[0,1,3,7,14,30,60];
function applySRS(p,isCorrect){
 p.attempts++;isCorrect?p.correct++:p.incorrect++;
 p.accuracy=pct(p.correct,p.attempts);p.lastAttemptedAt=Date.now();
 const due=new Date();
 if(isCorrect){
  p.streak++;
  const idx=clamp(p.streak,1,LADDER.length-1);
  p.interval=LADDER[idx];
  p.ease=clamp(p.ease+0.1,1.3,2.8);
  due.setDate(due.getDate()+p.interval);
  p.status=(p.streak>=5&&p.interval>=30)?"mastered":(p.interval>=7?"review":"learning");
 }else{
  p.streak=0;p.interval=0;p.ease=clamp(p.ease-0.2,1.3,2.8);
  due.setMinutes(due.getMinutes()+10); // review again soon
  p.status="difficult";
 }
 p.nextReviewAt=due.getTime();
 return p;
}

function recordAttempt(userId,word,isCorrect,userAnswer,rtMs,mode,at){

 const p=getProg(userId,word.id);applySRS(p,isCorrect);
 if(!isCorrect){
  const res=analyzeSpelling(word.display,userAnswer,{strict:userSettings().strict});
  for(const m of res.mistakes.slice(0,3)){
   DB.mistakes.push({id:uid(),userId,wordId:word.id,attemptId:aid,correctAnswer:word.display,userAnswer,mistakeType:m.type,mistakePosition:m.position??"",expectedCharacter:m.expected??"",actualCharacter:m.actual??"",editDistance:res.editDistance,createdAt:at});
  }
 }
 return aid;
}

function mistakePatterns(u){

 const{ctx,w,h}=prepCanvas(cv);const max=Math.max(...values,1);
 chartAxes(ctx,w,h,max);
 const n=labels.length,bw=Math.min(46,(w-60)/n*0.65),gap=(w-60)/n;
 values.forEach((v,i)=>{
  const bh=(h-32)*v/max,x=40+gap*i+(gap-bw)/2,y=h-24-bh;
  ctx.fillStyle=color||getCSS("--brand");
  ctx.beginPath();ctx.roundRect(x,y,bw,bh,4);ctx.fill();
  ctx.fillStyle=getCSS("--muted");ctx.font="10px sans-serif";
  ctx.fillText(labels[i],x-2,h-10);ctx.fillText(v,x+2,y-4);
 });
}
function drawLine(cv,labels,values,color){
 const{ctx,w,h}=prepCanvas(cv);const max=Math.max(...values,1);
 chartAxes(ctx,w,h,max);
 const pts=values.map((v,i)=>[40+(w-60)*i/Math.max(1,values.length-1),8+(h-32)*(1-v/max)]);
 ctx.strokeStyle=color||getCSS("--brand");ctx.lineWidth=2.5;ctx.beginPath();
 pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
 pts.forEach(p=>{ctx.fillStyle=color||getCSS("--brand");ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fill()});
 ctx.fillStyle=getCSS("--muted");ctx.font="10px sans-serif";
 labels.forEach((l,i)=>{if(values.length<=8||i%2===0)ctx.fillText(l,40+(w-60)*i/Math.max(1,values.length-1)-8,h-10)});
}

function buildQueue(cfg,userId){
 const active=DB.words.filter(w=>w.active);
 const P=w=>DB.progress[pkey(userId,w.id)];
 const pick=(arr,n)=>shuffle(arr).slice(0,n);
 switch(cfg.mode){
  case"quick":return pick(active,5);
  case"listen":case"read":{
   let pool=cfg.category?active.filter(w=>w.categories.includes(cfg.category)):active;
   // prioritize due + weak, mix in new
   const due=pool.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});
   const rest=pool.filter(w=>!due.includes(w));
   return[...shuffle(due).slice(0,Math.ceil(cfg.count/2)),...shuffle(rest)].slice(0,cfg.count);
  }
  case"mistakes":{const ids=[...new Set(userMistakes(userId).map(m=>m.wordId))];return pick(ids.map(wordById).filter(Boolean),cfg.count)}
  case"due":{const due=active.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.status!=="mastered"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});return shuffle(due).slice(0,cfg.count)}
  case"daily":{
   const seed=hashStr(todayISO());const rng=n=>(hashStr(todayISO()+n)%1000)/1000;
   const missed=[...new Set(userMistakes(userId).map(m=>m.wordId))].map(wordById).filter(Boolean);
   const difficult=active.filter(w=>P(w)&&P(w).status==="difficult");
   const due=active.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});
   const fresh=active.filter(w=>!P(w)||P(w).attempts===0);
   const q=[];const take=(arr,n)=>{for(const w of shuffle(arr)){if(q.length>=15||q.includes(w))continue;if(n-->0)q.push(w)}};
   take(missed,4);take(difficult,3);take(due,4);take(fresh,15);
   return q.slice(0,15);
  }
  case"timed":return shuffle(active).slice(0,60);
  case"category":return shuffle(active.filter(w=>w.categories.includes(cfg.category))).slice(0,cfg.count);
  case"list":{const l=DB.lists.find(l=>l.id===cfg.listId);return l?shuffle(l.wordIds.map(wordById).filter(Boolean)).slice(0,cfg.count):[]}
  case"pattern":return patternWords(cfg.pattern,userId,cfg.count);
 }
 return[];
}
function patternWords(type,userId,n){
 const missedIds=new Set(userMistakes(userId).filter(m=>m.mistakeType===type).map(m=>m.wordId));
 const pool=[...missedIds].map(wordById).filter(Boolean);
 const heur={
  double_consonant:/([bcdfghjklmnpqrstvwxyz])\1/,double_vowel:/([aeiou])\1/,
  transposition:w=>w.length>=6,missing_letter:w=>w.length>=7,
  extra_letter:w=>w.length>=7,wrong_letter:w=>w.difficulty>=2,
  wrong_ending:/(ing|ed|ly|ion|able|ment|ance|ence)$/,wrong_prefix:/.*/,
  spacing:/\s/,hyphenation:/-/,capitalization:/.*/
 }[type];
 if(heur&&pool.length<n){
  const extra=DB.words.filter(w=>w.active&&!missedIds.has(w.id)&&(typeof heur==="function"?heur(w.word):heur.test(w.word))).slice(0,n-pool.length);
  pool.push(...extra);
 }
 return shuffle(pool).slice(0,n);
}

function downloadFile(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){
 const rows=[];let row=[],cell="",inQ=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(inQ){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}else cell+=ch}
  else if(ch==='"')inQ=true;
  else if(ch===","){row.push(cell);cell=""}
  else if(ch==="\n"||ch==="\r"){if(cell!==""||row.length){row.push(cell);rows.push(row);row=[];cell=""}}
  else cell+=ch;
 }
 if(cell!==""||row.length){row.push(cell);rows.push(row)}
 return rows;
}
function csvImportModal(done){
 modal("CSV Import",`<p class="small muted">Expected format: <code>word,meaning,example,category,difficulty</code> (with header row). Data is validated and duplicates detected before import — nothing is silently overwritten.</p>
 <label>Paste CSV or choose a file</label><textarea id="csv-t" rows="6" placeholder="word,meaning,example,category,difficulty"></textarea>
 <input type="file" id="csv-f" accept=".csv,text/csv" style="margin-top:8px"/>
 <div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="csv-ok">Preview & Import</button></div>`,()=>{
  $("#csv-f").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#csv-t").value=r.result;r.readAsText(f)});
  $("#csv-ok").onclick=()=>{
   const rows=parseCSV($("#csv-t").value).filter(r=>r.some(c=>c.trim()));
   if(!rows.length)return toast("No CSV data found.","err");
   const start=/^\s*word\s*,/i.test(rows[0].join(","))?1:0;
   const preview=[];
   for(let i=start;i<rows.length;i++){
    const[word,meaning,example,category,difficulty]=rows[i].map(c=>(c||"").trim());
    if(!word)continue;
    const norm=word.toLowerCase();
    const dup=DB.words.find(w=>w.normalized===norm.replace(/[^a-z0-9]+/g,""));
    preview.push({word,meaning,example,category,difficulty:clamp(+difficulty||2,1,3),dup:!!dup,status:"ready"});
   }
   modal(`Import Preview — ${preview.length} entries`,`
    <div class="row wrap small muted" style="margin-bottom:8px"><span class="chip neutral">${preview.length} entries</span><span class="chip difficult">${preview.filter(p=>p.dup).length} duplicates (skipped)</span><span class="chip mastered">${preview.filter(p=>!p.dup).length} ready to import</span></div>
    <div style="max-height:320px;overflow:auto"><table><thead><tr><th>Word</th><th>Category</th><th>Difficulty</th><th>Status</th></tr></thead><tbody>
    ${preview.slice(0,100).map(p=>`<tr><td><strong>${esc(p.word)}</strong></td><td class="small">${esc(p.category||"—")}</td><td>${p.difficulty}★</td><td>${p.dup?'<span class="chip difficult">duplicate — skipped</span>':'<span class="chip mastered">ready</span>'}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="imp-go">Import ${preview.filter(p=>!p.dup).length} Words</button></div>`,
   ()=>{$("#imp-go").onclick=()=>{
    let imported=0;
    for(const p of preview){
     if(p.dup)continue;
     let catId=null;
     if(p.category){let c=DB.categories.find(c=>c.name.toLowerCase()===p.category.toLowerCase());if(!c){c={id:uid(),name:p.category};DB.categories.push(c)}catId=c.id}
     DB.words.push({...newWord(p.word,catId?[catId]:[],p.difficulty,"src_user"),meaning:p.meaning,example:p.example});
     imported++;
    }
    saveDB();closeModal();toast(`Vocabulary imported successfully (${imported} words).`,"ok");done&&done();
   }});

  };
 });
}

function adminImport(v){
 v.innerHTML=`<div class="grid g2">
  <div class="card pad">
   <h3>${ic("upload")} PDF Import</h3>

 </div>`;
 $("#csv-go").onclick=()=>csvImportModal(()=>render());
 $("#pdf-f").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const stat=$("#pdf-status");stat.textContent="Loading PDF engine…";
  try{
   if(!window.pdfjsLib){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
   }
   stat.textContent="Extracting text…";
   const buf=await f.arrayBuffer();
   const pdf=await pdfjsLib.getDocument({data:buf}).promise;
   let lines=[];
   for(let p=1;p<=pdf.numPages;p++){
    const tc=await pdf.getPage(p).getTextContent();
    let line="";for(const it of tc.items){line+=it.str;if(it.hasEOL){lines.push(line.trim());line=""}else line+=" "}

 });

function pdfExtract(lines,fileName){
 const entries=[];let currentCat="";
 const catGuess=/^[A-Z][A-Za-z '&/()-]{2,50}$/;
 const listMarker=/^[\s]*(\d+[\.\)]|[-•*])\s*/;
 const seen=new Set();
 for(const raw of lines){
  let line=raw.replace(listMarker,"").replace(/\s{2,}/g," ").trim();
  if(!line||line.length<2)continue;
  const looksCat=line===line.toUpperCase()&&line.length<=50&&/[A-Z]/.test(line);
  const shortNoPunct=!/[.,;:]$/.test(line)&&line.split(/\s+/).length<=4&&/^[A-Z]/.test(line)&&!seen.has(line.toLowerCase());
  if(looksCat||(shortNoPunct&&line.split(/\s+/).length<=3&&!entries.some(e=>e.word.toLowerCase()===line.toLowerCase())&&Math.random===Math.random&&false)){
   currentCat=line.replace(/\b\w/g,c=>c.toUpperCase());continue;
  }
  if(shortNoPunct&&line.split(/\s+/).length<=3&&currentCat&&entries.length&&/^[a-z]/.test(entries[entries.length-1].word)){currentCat=currentCat;/*continue below as word*/}
  // multi-word phrases allowed; strip trailing punctuation artifacts
  let word=line.replace(/[.,;:]+$/,"").trim();
  if(!/^[A-Za-z][A-Za-z'\- ]*$/.test(word)){continue}
  const norm=word.toLowerCase().replace(/[^a-z0-9]+/g,"");
  const dupInFile=seen.has(norm);seen.add(norm);
  const dupDB=DB.words.find(w=>w.normalized===norm);
  entries.push({word,category:currentCat,dupInFile,dupDB:!!dupDB,hyphenated:/-/.test(word),multiword:/\s/.test(word),needsReview:word.length<2||dupInFile,status:dupDB?"duplicate":"ready"});
 }
 const total=entries.length;
 const unique=new Set(seen).size;
 const cats=[...new Set(entries.map(e=>e.category).filter(Boolean))];
 return{entries,total,unique,cats,fileName};
}

  };
 });

  <div class="card pad"><h3>Mistake Type Distribution</h3>${Object.keys(types).length?`<canvas id="ac3"></canvas>`:`<p class="small muted">No mistakes recorded yet.</p>`}</div>
  <div class="card pad"><h3>Needs Review Queue</h3>
   ${DB.words.filter(w=>w.needsReview).length?DB.words.filter(w=>w.needsReview).slice(0,10).map(w=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><strong>${esc(w.display)}</strong><button class="btn" data-clear="${w.id}">Mark reviewed</button></div>`).join(""):`<p class="small muted">No entries flagged for review. 🎉</p>`}
  </div>
 </div>`;
 const labels=Object.keys(accByDay).map(k=>+k.slice(8));
 drawLine($("#ac1"),labels,Object.values(accByDay));
 drawBars($("#ac2"),labels,Object.values(volByDay));
 if(Object.keys(types).length)drawBars($("#ac3"),Object.keys(types).map(t=>(ERRTYPES[t]||t).split(" ")[0]),Object.values(types),getCSS("--bad"));
 $$("[data-clear]").forEach(b=>b.onclick=()=>{wordById(b.dataset.clear).needsReview=false;saveDB();toast("Marked as reviewed.","ok");render()});
}

/* ============================ GLOBAL ACTIONS ============================ */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const act=el.dataset.act;
 if(act==="close-modal")closeModal();
 if(act==="guest"){DB.currentUserId="guest";saveDB();toast("Guest mode — your progress syncs when you create an account.","ok");navigate("/dashboard")}
 if(act==="logout"){session=null;saveSessionFn();DB.currentUserId=null;saveDB();toast("Logged out.");navigate("/")}
});
window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
/* boot */
loadDB();
// fix: ensure endSession's save marker trick doesn't break
render();
</script>
</body>
</html>
