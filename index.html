<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SpellMaster Pro — Fix Your Spelling. One Mistake at a Time.</title>
<!--
  ============================================================================
  SpellMaster Pro — single-file spelling & vocabulary learning platform
  ============================================================================
  INITIAL VOCABULARY (hard-coded, two PDF sources, canonical-word model):
    Source 1: "List of words in the IELTS Listening Test" (Jibon IELTS, scan PDF)
    Source 2: "The 1200 most commonly repeated words in IELTS Listening Test"
              (text PDF)
    All categories transcribed verbatim from both documents. Words shared by
    both sources are stored as ONE canonical record linked to both sources;
    in-category duplicates are merged; cross-category repeats become junction
    links. Source-faithful extraction artifacts are flagged needs_review.
  Full learning loop: listen/type → spelling engine → mistake classification
  → visual diff → SRS → recommendations → analytics → admin → gamification.
  DEMO LOGINS (seeded): admin@spellmaster.app / admin123
                        demo@spellmaster.app  / demo123
  ============================================================================
-->
<style>
:root{--bg:#f5f6fa;--card:#ffffff;--text:#1a2233;--muted:#64708a;--line:#e4e7ef;--brand:#4f46e5;--brand-soft:#eef0ff;--ok:#16a34a;--ok-soft:#e8f7ee;--bad:#dc2626;--bad-soft:#fdecec;--warn:#d97706;--warn-soft:#fdf3e3;--r:14px;--sh:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06)}
[data-theme="dark"]{--bg:#0e131f;--card:#171e2e;--text:#e8ebf4;--muted:#8b93ab;--line:#28324c;--brand:#818cf8;--brand-soft:#232b49;--ok:#4ade80;--ok-soft:#15301f;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#33270f;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);transition:.15s;min-height:38px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:14px 26px;font-size:16px;min-height:48px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip.new{background:var(--brand-soft);color:var(--brand)}
.chip.learning{background:var(--warn-soft);color:var(--warn)}
.chip.review{background:#e0f2fe;color:#0369a1}
.chip.difficult{background:var(--bad-soft);color:var(--bad)}
.chip.mastered{background:var(--ok-soft);color:var(--ok)}
.chip.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{padding:16px}
.stat .v{font-size:26px;font-weight:700;margin-top:2px}
.stat .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--brand-soft)}
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;z-index:30}
.sidebar .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;padding:6px 8px 16px}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:2px}
.navlink svg{width:18px;height:18px;flex:none}
.navlink:hover{background:var(--bg);color:var(--text)}
.navlink.active{background:var(--brand-soft);color:var(--brand)}
.navsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:14px 11px 5px}
.main{flex:1;min-width:0;padding:20px 24px 90px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.searchwrap{position:relative;flex:1;max-width:420px}
.searchres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);z-index:50;max-height:340px;overflow:auto}
.searchres .sr{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.searchres .sr:hover{background:var(--brand-soft)}
#burger{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px;z-index:50}
.hero{padding:70px 24px 50px;text-align:center;max-width:820px;margin:0 auto}
.hero h1{font-size:42px;line-height:1.15;letter-spacing:-.5px}
.hero p{font-size:18px;color:var(--muted);margin:16px 0 28px}
.featgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1040px;margin:30px auto;padding:0 24px}
.steps{max-width:760px;margin:20px auto;padding:0 24px}
.step{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.step b{width:34px;height:34px;flex:none;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pcard{max-width:640px;margin:0 auto;padding:26px;text-align:center}
.qmeta{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px}
.bigword-slot{min-height:60px}
#answer-input{font-size:22px;text-align:center;padding:14px;letter-spacing:.5px}
.audio-grid{display:flex;justify-content:center;gap:10px;margin:16px 0;flex-wrap:wrap}
.diff-word{font-size:22px;font-weight:700;letter-spacing:3px}
.diff-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;justify-content:center}
.diff-c{width:30px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-weight:700;font-size:17px;border:1.5px solid transparent}
.diff-c.ok{border-color:var(--line)}
.diff-c.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.diff-c.miss{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);border-style:dashed}
.diff-c.extra{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.explain-box{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:12px 16px;margin:14px 0;text-align:left}
.explain-box ul{margin:6px 0 0 18px}
.flashword{font-size:34px;font-weight:800;letter-spacing:2px;transition:opacity 1.4s}
.pulse{animation:pp .35s}
@keyframes pp{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timerbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timerbar>div{height:100%;background:var(--brand);transition:width 1s linear}
.modecard{cursor:pointer;padding:16px;text-align:left}
.modecard:hover{border-color:var(--brand)}
.modecard.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
#toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;box-shadow:var(--sh);padding:11px 16px;font-size:14px;font-weight:600;animation:tin .25s;max-width:340px}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bk{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--card);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;color:transparent!important}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:10px}
.ach{display:flex;gap:12px;align-items:center;padding:14px}
.ach.locked{opacity:.45;filter:grayscale(1)}
.ach .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
canvas{width:100%;height:220px;display:block}
.bottomnav{display:none}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.featgrid{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}}
@media(max-width:720px){
 .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.25s;box-shadow:var(--sh)}
 .sidebar.open{transform:none}
 #burger{display:inline-flex}
 .main{padding:14px 14px 100px}
 .g4,.g3,.g2{grid-template-columns:1fr 1fr}
 .featgrid{grid-template-columns:1fr}
 .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
 .bottomnav a.active{color:var(--brand)}
 .bottomnav svg{width:20px;height:20px}
 .hide-m{display:none!important}
 #answer-input{font-size:19px}
}
</style>
</head>

const normOf=w=>w.toLowerCase().trim().replace(/[^a-z0-9]+/g,"");
function guessDifficulty(w){
 if(/\s/.test(w)&&w.length>=14)return 3;
 if(w.length>=10||/(ph|kn|gh|sc|ps|mn|gue|quo)/.test(w))return 3;
 if(w.length>=7||/\s/.test(w))return 2;
 return 1;
}
function newWord(w,cats,sourceId){
 const lw=w.toLowerCase().trim();
 return{id:uid(),word:lw,display:w,normalized:normOf(w),categories:cats,difficulty:guessDifficulty(lw),source:sourceId||SEED_SOURCES[0].id,
  meaning:"",example:"",pos:"",ipa:"",needsReview:NEEDS_REVIEW.has(w),active:true,createdAt:Date.now(),
  isMultiword:/\s/.test(lw),isHyphenated:/-/.test(lw)};
}
function seedDB(){
 DB.categories=[];DB.words=[];
 const catId={};const ensureCat=n=>{if(!catId[n]){const c={id:uid(),name:n};DB.categories.push(c);catId[n]=c.id}return catId[n]};
 const byNorm={};let mergedDupes=0,junctionLinks=0,crossSourceLinks=0;
 const report=[];
 const loadSource=(RAWobj,srcId)=>{
  let listed=0,created=0,linked=0,dupInSrc=0;
  for(const[cat,items]of Object.entries(RAWobj)){
   const cid=ensureCat(cat);
   for(const w of items){
    listed++;
    const key=normOf(w),ex=byNorm[key];
    if(ex){ // canonical-word model: no duplicate records, only category junctions
     if(ex.categories.includes(cid)){dupInSrc++;mergedDupes++}
     else{ex.categories.push(cid);junctionLinks++;linked++}
     if(ex.source!==srcId)crossSourceLinks++;
     continue;
    }
    const rec=newWord(w,[cid],srcId);
    byNorm[key]=rec;DB.words.push(rec);created++;
   }
  }
  report.push({sourceId:srcId,listed,created,linked,dupInSrc});
 };
 loadSource(RAW,SEED_SOURCES[0].id);
 loadSource(RAW2,SEED_SOURCES[1].id);
 const now=Date.now();
 const mk=(name,email,pass,role)=>({id:uid(),name,email,pass,role,createdAt:now,settings:{theme:"light",accent:"british",voice:"",speed:1,dailyGoal:30,strict:true,practiceDefault:"listen",hideLeaderboard:false,targetExam:"IELTS",targetBand:"",currentBand:""}});
 DB={users:[],currentUserId:null,words:DB.words,categories:DB.categories,
  sources:[...SEED_SOURCES.map(s=>({...s,createdAt:now})),{id:"src_admin",name:"Admin Added",type:"Manual",createdAt:now},{id:"src_user",name:"User Added",type:"Import",createdAt:now}],
  attempts:[],mistakes:[],progress:{},sessions:[],lists:[],dailyDone:{},streaks:{},xp:{},achievements:{},settings:{},
  seedMeta:{sources:report,unique:DB.words.length,mergedDupes,junctionLinks,crossSourceLinks,categories:DB.categories.length,importedAt:now}};
 const admin=mk("Admin","admin@spellmaster.app","admin123","admin");
 DB.users.push(admin);
 const demo=mk("Demo Learner","demo@spellmaster.app","demo123","user");
 DB.users.push(demo);
 generateDemoHistory(demo.id);
 saveDB();
}
function generateDemoHistory(uid){
 // Clearly-labeled demo account with generated history so charts/analytics are explorable.
 const words=DB.words;
 let base=Date.now()-14*864e5;
 for(let d=14;d>=1;d--){
  const off=hashStr("day"+d)%300;
  const day=words.slice(off,off+8+(d%5));
  for(const w of day){
   const correct=Math.random()>0.28;
   recordAttempt(uid,w,correct,correct?w.display:w.display.replace(/[aeiou]/,"a"),3000+Math.random()*5000,"listen",base+d*864e5);
  }
 }
}

function levenshteinOps(a,b){
 const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1),dp[i-1][j]+1,dp[i][j-1]+1);
 const ops=[];let i=m,j=n;
 while(i>0||j>0){
  if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ops.unshift({op:a[i-1]===b[j-1]?"match":"sub",ai:i-1,bj:j-1,aChar:a[i-1],bChar:b[j-1]});i--;j--}
  else if(i>0&&dp[i][j]===dp[i-1][j]+1){ops.unshift({op:"extra",ai:i-1,bj:null,aChar:a[i-1],bChar:null});i--}
  else{ops.unshift({op:"missing",ai:null,bj:j-1,aChar:null,bChar:b[j-1]});j--}
 }
 return{dist:dp[m][n],ops};
}
function analyzeSpelling(correctRaw,attemptRaw,opts={}){
 const strict=opts.strict!==false;
 const cR=String(correctRaw).trim(),aR=String(attemptRaw).trim();
 const strip=s=>s.toLowerCase().replace(/[\s\-–—_]/g,"");
 if(strip(cR)===strip(aR)){
  if(cR===aR)return{correct:true,editDistance:0,mistakes:[],notes:[]};
  let issues=[];
  if(cR.toLowerCase()===aR.toLowerCase())issues.push("capitalization");
  else if((cR.match(/-/g)||[]).join("")!==(aR.match(/-/g)||[]).join(""))issues.push("hyphenation");
  else issues.push("spacing");
  return{correct:!strict,editDistance:1,mistakes:strict?issues.map(t=>({type:t,explanation:explain(t,cR,aR,null)})):[],notes:issues.map(t=>ERRTYPES[t])};
 }
 let c=cR.toLowerCase(),a=aR.toLowerCase();
 if(!strict){c=c.replace(/-/g," ");a=a.replace(/-/g," ")}
 const{dist,ops}=levenshteinOps(a,c);
 let transposed=-1;
 if(dist===2&&a.length===c.length){
  for(let i=0;i<c.length-1;i++){if(c.slice(0,i)+c[i+1]+c[i]+c.slice(i+2)===a){transposed=i;break}}
 }
 const mistakes=[];
 if(transposed>=0){
  mistakes.push({type:"transposition",position:transposed,expected:c[transposed]+c[transposed+1],actual:a[transposed]+a[transposed+1],
   explanation:`You reversed the order of "${c[transposed]}" and "${c[transposed+1]}" — it should be "${c[transposed]}${c[transposed+1]}", not "${a[transposed]}${a[transposed+1]}".`});
 }else{
  const errPos=ops.filter(o=>o.op!=="match").map(o=>o.bj??c.length);
  const minPos=Math.min(...errPos,c.length),maxPos=Math.max(...errPos,-1);
  const atEnd=maxPos>=c.length-3&&maxPos<c.length+1,atStart=minPos<=2;
  for(const o of ops){
   if(o.op==="match")continue;
   let type;
   if(o.op==="missing"){
    const prevSame=o.bj>0&&c[o.bj-1]===o.bChar,nextSame=o.bj<c.length-1&&c[o.bj+1]===o.bChar;
    type=(prevSame||nextSame)?(isVowel(o.bChar)?"double_vowel":"double_consonant"):"missing_letter";
   }else if(o.op==="extra")type="extra_letter";
   else type="wrong_letter";
   if(type==="wrong_letter"&&atEnd&&c.length>=4)type="wrong_ending";
   else if(type==="wrong_letter"&&atStart&&c.length>=4)type="wrong_prefix";
   mistakes.push({type,position:o.bj??o.ai,expected:o.bChar,actual:o.aChar,explanation:explain(type,cR,aR,o)});
  }
 }
 return{correct:mistakes.length===0,editDistance:dist,mistakes,notes:[]};
}
function explain(type,c,a,o){
 switch(type){
  case"missing_letter":return`You missed the letter "${o?o.bChar:""}" — it's missing from your answer.`;
  case"extra_letter":return`You added an extra letter "${o?o.aChar:""}" that doesn't belong.`;
  case"wrong_letter":return`You substituted "${o?o.aChar:""}" for "${o?o.bChar:""}".`;
  case"transposition":return"You reversed the order of two adjacent letters.";
  case"double_consonant":return`You missed one of the repeated consonant characters ("${o?o.bChar:""}") — this word has a double consonant.`;
  case"double_vowel":return`You missed one of the repeated vowels ("${o?o.bChar:""}") — this word has a double vowel.`;
  case"wrong_ending":return"The ending of the word is incorrect — check the suffix.";
  case"wrong_prefix":return"The beginning of the word is incorrect — check the prefix.";
  case"spacing":return"Check the spacing between words.";
  case"hyphenation":return"Check the hyphenation — a hyphen is required (or placed differently).";
  case"capitalization":return"Check the capitalization.";
 }
 return"Spelling difference detected.";
}
function diffTokens(correct,attempt,opts={}){
 const res=analyzeSpelling(correct,attempt,opts);
 if(res.correct&&res.mistakes.length===0)return{ok:true};
 let c=correct.trim().toLowerCase(),a=attempt.trim().toLowerCase();
 if(!opts.strict){c=c.replace(/-/g," ");a=a.replace(/-/g," ")}
 const{ops}=levenshteinOps(a,c);
 const correctRow=[],userRow=[];
 for(const o of ops){
  if(o.op==="match"){correctRow.push({ch:o.bChar,st:"ok"});userRow.push({ch:o.aChar,st:"ok"})}
  else if(o.op==="missing"){correctRow.push({ch:o.bChar,st:"bad"});userRow.push({ch:"·",st:"miss"})}
  else if(o.op==="extra"){userRow.push({ch:o.aChar,st:"extra"})}
  else{correctRow.push({ch:o.bChar,st:"bad"});userRow.push({ch:o.aChar,st:"bad"})}
 }
 return{ok:false,correctRow,userRow};
}
function renderDiff(correct,attempt,opts={}){
 const t=diffTokens(correct,attempt,opts);
 if(t.ok)return`<div class="diff-row"><span class="diff-c ok" style="width:auto;padding:0 14px">${esc(correct)}</span></div>`;
 const row=r=>`<div class="diff-row" role="list">${r.map(x=>`<span class="diff-c ${x.st}" role="listitem" aria-label="${x.st==="miss"?"missing letter":x.st==="bad"?"wrong position":x.st==="extra"?"extra letter":x.ch}">${esc(x.ch)}</span>`).join("")}</div>`;
 return`<div class="small muted" style="margin-top:8px">Correct spelling:</div>${row(t.correctRow)}<div class="small muted" style="margin-top:8px">Your answer:</div>${row(t.userRow)}
 <div class="small muted" style="margin-top:8px">Legend: <span class="diff-c bad" style="display:inline-flex;width:auto;padding:0 8px">wrong / missing spot</span> <span class="diff-c miss" style="display:inline-flex;width:auto;padding:0 8px">· letter you missed</span> <span class="diff-c extra" style="display:inline-flex;width:auto;padding:0 8px">extra letter</span></div>`;
}

/* ============================ SRS ============================ */
const LADDER=[0,1,3,7,14,30,60];
function applySRS(p,isCorrect){
 p.attempts++;isCorrect?p.correct++:p.incorrect++;
 p.accuracy=pct(p.correct,p.attempts);p.lastAttemptedAt=Date.now();
 const due=new Date();
 if(isCorrect){
  p.streak++;
  p.interval=LADDER[clamp(p.streak,1,LADDER.length-1)];
  p.ease=clamp((p.ease||2.5)+0.1,1.3,2.8);
  due.setDate(due.getDate()+p.interval);
  p.status=(p.streak>=5&&p.interval>=30)?"mastered":(p.interval>=7?"review":"learning");
 }else{
  p.streak=0;p.interval=0;p.ease=clamp((p.ease||2.5)-0.2,1.3,2.8);
  due.setMinutes(due.getMinutes()+10);
  p.status="difficult";
 }
 p.nextReviewAt=due.getTime();
 return p;
}

function recordAttempt(userId,word,isCorrect,userAnswer,rtMs,mode,at){
 at=at||Date.now();
 const aid=uid();
 DB.attempts.push({id:aid,userId,wordId:word.id,correctAnswer:word.display,userAnswer,isCorrect,responseTimeMs:Math.round(rtMs),practiceMode:mode,createdAt:at});
 const p=getProg(userId,word.id);applySRS(p,isCorrect);
 if(!isCorrect){
  const res=analyzeSpelling(word.display,userAnswer,{strict:userSettings().strict});
  for(const m of res.mistakes.slice(0,3)){
   DB.mistakes.push({id:uid(),userId,wordId:word.id,attemptId:aid,correctAnswer:word.display,userAnswer,mistakeType:m.type,mistakePosition:m.position??"",expectedCharacter:m.expected??"",actualCharacter:m.actual??"",editDistance:res.editDistance,createdAt:at});
  }
 }
 return aid;
}

function updateStreak(id){
 const today=todayISO(),s=DB.streaks[id]||{current:0,longest:0,lastDate:null};
 if(s.lastDate===today)return s;
 const y=new Date();y.setDate(y.getDate()-1);
 s.current=(s.lastDate===todayISO(y))?s.current+1:1;
 s.longest=Math.max(s.longest,s.current);s.lastDate=today;DB.streaks[id]=s;return s;
}
function userStats(u){

 const today=todayISO();
 const todayAttempts=at.filter(a=>todayISO(a.createdAt)===today);
 const wk=at.filter(a=>a.createdAt>Date.now()-7*864e5),pw=at.filter(a=>a.createdAt<=Date.now()-7*864e5&&a.createdAt>Date.now()-14*864e5);
 const due=DB.words.filter(w=>{const p=DB.progress[pkey(u,w.id)];return p&&p.status!=="new"&&p.status!=="mastered"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()}).length;
 return{totalAttempts:at.length,todayWords:todayAttempts.length,accuracy:pct(at.filter(a=>a.isCorrect).length,at.length),
  practiced:new Set(at.map(a=>a.wordId)).size,mastered:pg.filter(p=>p.status==="mastered").length,
  difficult:pg.filter(p=>p.status==="difficult").length,learning:pg.filter(p=>p.status==="learning"||p.status==="review").length,
  totalMistakes:userMistakes(u).length,due,weekWords:wk.length,
  weekAcc:pct(wk.filter(a=>a.isCorrect).length,wk.length),prevAcc:pct(pw.filter(a=>a.isCorrect).length,pw.length)};

function mistakePatterns(u){
 const ms=userMistakes(u);if(!ms.length)return[];
 const by={};for(const m of ms)by[m.mistakeType]=(by[m.mistakeType]||0)+1;

}
function insights(u){
 const out=[],s=userStats(u);
 if(s.totalAttempts<10)return[{icon:"bulb",text:"Practice a few more words (at least 10 attempts) and personalised insights will appear here based on your real data."}];
 const diff=s.weekAcc-s.prevAcc;
 if(Math.abs(diff)>=3)out.push({icon:"chart",text:`Your accuracy ${diff>0?"improved":"dropped"} by ${Math.abs(Math.round(diff))}% this week (${s.weekAcc}% vs ${Math.round(s.prevAcc)}%).`});
 const pat=mistakePatterns(u);
 if(pat.length)out.push({icon:"target",text:`You make the most mistakes with ${ERRTYPES[pat[0].type]?pat[0].type.replace(/_/g," "):pat[0].type} — ${pat[0].share}% of your errors.`});
 if(s.due>0)out.push({icon:"clock",text:`${s.due} word${s.due>1?"s are":" is"} ready for review today.`});
 if(s.mastered>0)out.push({icon:"trophy",text:`You have mastered ${s.mastered} word${s.mastered>1?"s":""}. Keep going!`});
 const st=DB.streaks[u];if(st&&st.current>=3)out.push({icon:"flame",text:`You're on a ${st.current}-day streak — don't break it!`});
 return out;
}

function checkAchievements(u){

const TTS={voices:[],load(){if(!("speechSynthesis" in window))return;const f=()=>{TTS.voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)?/i.test(v.lang))};f();speechSynthesis.onvoiceschanged=f},
 speak(text,{rate=1,lang}={}){
  const st=userSettings();
  if(!("speechSynthesis" in window)){toast("Speech synthesis isn't supported in this browser.","warn");return false}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const wantLang=lang||(st.accent==="american"?"en-US":"en-GB");
  u.lang=wantLang;u.rate=clamp(rate*(st.speed||1),0.5,1.6);
  const v=TTS.voices.find(v=>v.lang===wantLang&&v.name===st.voice)||TTS.voices.find(v=>v.lang===wantLang)||TTS.voices.find(v=>v.lang.startsWith("en"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);return true;
 },
 stop(){if("speechSynthesis" in window)speechSynthesis.cancel()}};
TTS.load();

function prepCanvas(cv){const dpr=window.devicePixelRatio||1;const w=cv.clientWidth||600,h=cv.clientHeight||220;cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);return{ctx,w,h}}

function chartAxes(ctx,w,h,max){ctx.strokeStyle=getCSS("--line");ctx.fillStyle=getCSS("--muted");ctx.font="11px sans-serif";ctx.beginPath();ctx.moveTo(34,8);ctx.lineTo(34,h-24);ctx.lineTo(w-8,h-24);ctx.stroke();for(let i=0;i<=4;i++){const y=8+(h-32)*i/4;ctx.fillText(Math.round(max*(4-i)/4),4,y+4)}}
function drawBars(cv,labels,values,color){
 if(!cv)return;const{ctx,w,h}=prepCanvas(cv);const max=Math.max(...values,1);
 chartAxes(ctx,w,h,max);
 const n=labels.length,bw=Math.min(46,(w-60)/n*0.65),gap=(w-60)/n;
 values.forEach((v,i)=>{
  const bh=(h-32)*v/max,x=40+gap*i+(gap-bw)/2,y=h-24-bh;
  ctx.fillStyle=color||getCSS("--brand");
  ctx.beginPath();ctx.roundRect(x,y,bw,bh,4);ctx.fill();
  ctx.fillStyle=getCSS("--muted");ctx.font="10px sans-serif";
  ctx.fillText(labels[i],x-2,h-10);ctx.fillText(v,x+2,y-4);
 });
}
function drawLine(cv,labels,values,color){
 if(!cv)return;const{ctx,w,h}=prepCanvas(cv);const max=Math.max(...values,1);
 chartAxes(ctx,w,h,max);
 const pts=values.map((v,i)=>[40+(w-60)*i/Math.max(1,values.length-1),8+(h-32)*(1-v/max)]);
 ctx.strokeStyle=color||getCSS("--brand");ctx.lineWidth=2.5;ctx.beginPath();
 pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
 pts.forEach(p=>{ctx.fillStyle=color||getCSS("--brand");ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fill()});
 ctx.fillStyle=getCSS("--muted");ctx.font="10px sans-serif";
 labels.forEach((l,i)=>{if(values.length<=8||i%2===0)ctx.fillText(l,40+(w-60)*i/Math.max(1,values.length-1)-8,h-10)});
}

function buildQueue(cfg,userId){
 const active=DB.words.filter(w=>w.active);
 const P=w=>DB.progress[pkey(userId,w.id)];
 const pick=(arr,n)=>shuffle(arr).slice(0,n);
 switch(cfg.mode){
  case"quick":return pick(active,5);
  case"listen":case"read":{
   let pool=cfg.category?active.filter(w=>w.categories.includes(cfg.category)):active;
   const due=pool.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});
   const rest=pool.filter(w=>!due.includes(w));
   return[...shuffle(due).slice(0,Math.ceil(cfg.count/2)),...shuffle(rest)].slice(0,cfg.count);
  }
  case"mistakes":case"due":{
   if(cfg.mode==="due"){const due=active.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.status!=="mastered"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});return shuffle(due).slice(0,cfg.count)}
   const ids=[...new Set(userMistakes(userId).map(m=>m.wordId))];return pick(ids.map(wordById).filter(Boolean),cfg.count);
  }
  case"daily":{
   const missed=[...new Set(userMistakes(userId).map(m=>m.wordId))].map(wordById).filter(Boolean);
   const difficult=active.filter(w=>P(w)&&P(w).status==="difficult");
   const due=active.filter(w=>{const p=P(w);return p&&p.status!=="new"&&p.nextReviewAt&&p.nextReviewAt<=Date.now()});
   const fresh=active.filter(w=>!P(w)||P(w).attempts===0);
   const q=[];const take=(arr,n)=>{for(const w of shuffle(arr)){if(q.length>=15||q.includes(w))continue;if(n-->0)q.push(w)}};
   take(missed,4);take(difficult,3);take(due,4);take(fresh,15);
   return q.slice(0,15);
  }
  case"timed":return shuffle(active).slice(0,60);
  case"category":return shuffle(active.filter(w=>w.categories.includes(cfg.category))).slice(0,cfg.count);
  case"list":{const l=DB.lists.find(l=>l.id===cfg.listId);return l?shuffle(l.wordIds.map(wordById).filter(Boolean)).slice(0,cfg.count):[]}
  case"pattern":return patternWords(cfg.pattern,userId,cfg.count);
 }
 return[];
}
function patternWords(type,userId,n){
 const missedIds=new Set(userMistakes(userId).filter(m=>m.mistakeType===type).map(m=>m.wordId));
 const pool=[...missedIds].map(wordById).filter(Boolean);
 const heur={
  double_consonant:/([bcdfghjklmnpqrstvwxyz])\1/,double_vowel:/([aeiou])\1/,
  transposition:w=>w.length>=6,missing_letter:w=>w.length>=7,
  extra_letter:w=>w.length>=7,wrong_letter:w=>w.difficulty>=2,
  wrong_ending:/(ing|ed|ly|ion|able|ment|ance|ence)$/,wrong_prefix:/.*/,
  spacing:/\s/,hyphenation:/-/,capitalization:/.*/
 }[type];
 if(heur&&pool.length<n){
  const extra=DB.words.filter(w=>w.active&&!missedIds.has(w.id)&&(typeof heur==="function"?heur(w.word):heur.test(w.word))).slice(0,n-pool.length);
  pool.push(...extra);
 }
 return shuffle(pool).slice(0,n);
}
function startSession(cfg){
 const u=curUser();

function saveSession(){

}
function loadSession(){

}

function feedbackHTML(w){
 const r=session.last.res,ans=session.last.ans;
 const hist=userMistakes(curUser().id).filter(m=>m.wordId===w.id).length;
 return`
  <div class="${r.correct?"pulse":"shake"}" role="status" aria-live="polite">
   ${r.correct?`<h2 style="color:var(--ok)">✓ Correct!</h2><p class="small muted">Correct spelling: <strong class="diff-word">${esc(w.display.toUpperCase())}</strong></p>`:`<h2 style="color:var(--bad)">✗ Not quite</h2>`}
   ${!r.correct?renderDiff(w.display,ans,{strict:userSettings().strict}):""}
   ${r.mistakes.length?`<div class="explain-box"><strong>Why this was wrong:</strong><ul>${r.mistakes.map(m=>`<li>${esc(m.explanation)}</li>`).join("")}</ul><p class="small" style="margin-top:6px">Mistake type${r.mistakes.length>1?"s":""}: <strong>${r.mistakes.map(m=>ERRTYPES[m.type]||m.type).join(", ")}</strong></p>${hist>0?`<p class="small" style="margin-top:4px">⚠ You have now misspelled this word <strong>${hist+1}</strong> time${hist?"s":""}. It has been scheduled for review.</p>`:""}</div>
   <button class="btn" data-act="similar">${ic("target")} Practice Similar Words</button>`:""}
   ${r.notes&&r.notes.length?`<div class="explain-box" style="background:var(--brand-soft);border-color:var(--brand)"><strong>Note:</strong> ${r.notes.join("; ")} — accepted in flexible mode.</div>`:""}
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary big" id="next-btn">Next Word ${ic("down")}</button></div>
  </div>`;
}
function wireSession(w){
 $("#quit").onclick=e=>{e.preventDefault();if(confirm("End this session? Your answers so far will be saved."))endSession()};
 if(session.mode==="timed"){
  const tick=()=>{if(!session)return;
   const left=Math.max(0,session.endsAt-Date.now());
   const bar=$("#tbar"),tl=$("#tleft");
   if(bar)bar.style.width=(left/(session.duration*1000)*100)+"%";
   if(tl)tl.textContent=Math.ceil(left/1000)+"s remaining";
   if(left<=0){toast("Time's up!","warn");endSession()}};
  clearInterval(session.timerInt);tick();session.timerInt=setInterval(tick,500);
 }
 if(session.checked){
  $("#next-btn").onclick=()=>nextWord();
  const sim=$("[data-act=similar]");if(sim)sim.onclick=()=>{startSession({mode:"pattern",pattern:(session.last.res.mistakes[0]||{}).type||"double_consonant",count:10,title:"Similar Mistake Practice"})};
  setTimeout(()=>$("#next-btn")?.focus(),60);
  return;
 }
 const input=$("#answer-input");
 if(session.mode==="read"){setTimeout(()=>{const f=$("#flash");if(f)f.style.opacity="0.08"},2000)}
 const play=r=>{TTS.speak(w.display,{rate:r});if(!session.checked)input?.focus()};
 $("#play-btn")?.addEventListener("click",()=>play(1));
 $("#replay-btn")?.addEventListener("click",()=>play(1));
 $("#slow-btn")?.addEventListener("click",()=>play(0.6));
 setTimeout(()=>play(1),350);
 $("#skip-btn")?.addEventListener("click",()=>nextWord());
 $("#check-btn").onclick=submitAnswer;
 input.addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});
 input.focus();
}
function submitAnswer(){
 const w=session.queue[session.idx];
 const input=$("#answer-input");
 const ans=input.value.trim();
 if(!ans)return toast("Type your answer first.","warn");
 const rt=Date.now()-session.lastWordAt;
 const res=analyzeSpelling(w.display,ans,{strict:userSettings().strict});
 recordAttempt(session.userId,w,res.correct,ans,rt,session.mode);
 session.results.push({wordId:w.id,correctAnswer:w.display,userAnswer:ans,res,startedAt:session.lastWordAt});
 session.lastWordAt=Date.now();
 if(res.correct){session.correct++;addXP(session.userId,10)}else session.incorrect++;
 saveDB();saveSession();
 session.checked=true;session.last={ans,res};
 renderSessionView($("#view"));
}
function nextWord(){
 session.checked=false;session.last=null;session.idx++;
 if(session.mode!=="timed"&&session.idx>=session.queue.length)return endSession();
 saveSession();renderSessionView($("#view"));
}
function endSession(){
 if(!session)return;
 clearInterval(session.timerInt);
 const total=session.results.length;
 const rtSum=session.results.reduce((s,r)=>s+(Date.now()-(r.startedAt||session.startedAt)),0);
 const rec={id:session.id,userId:session.userId,practiceMode:session.mode,category:session.category,listId:session.listId,pattern:session.pattern,
  totalWords:total,completedWords:total,correctCount:session.correct,incorrectCount:session.incorrect,accuracy:pct(session.correct,total),
  averageResponseTime:total?Math.round(rtSum/total/100)/10:0,startedAt:session.startedAt,completedAt:Date.now()};
 if(total>=5)updateStreak(session.userId);
 if(total>0){
  DB.sessions.push(rec);
  addXP(session.userId,rec.correctCount*10+(rec.accuracy>=90?20:5));
  if(session.mode==="daily")DB.dailyDone[session.userId]=todayISO();
  checkAchievements(session.userId);
 }
 session=null;saveSession();
 navigate(total>=5?"/result/"+rec.id:"/dashboard");
}

function vMistakes(v,u){

  if(cur==="freq"){const cnt={};ms.forEach(m=>cnt[m.wordId]=(cnt[m.wordId]||0)+1);list=[...ms].sort((a,b)=>cnt[b.wordId]-cnt[a.wordId])}
  v.innerHTML=`<h1>Your Mistakes</h1>

  <div id="mlist">${list.length?list.map(m=>{const cnt=ms.filter(x=>x.wordId===m.wordId).length;
   return`<div class="card pad" style="margin-bottom:12px">
    <div class="row spread wrap">
     <div><a href="#/vocabulary/${m.wordId}"><strong style="font-size:16px">${esc(m.correctAnswer)}</strong></a>
      <span class="chip difficult">${ERRTYPES[m.mistakeType]||m.mistakeType}</span></div>
     <div class="row"><span class="small muted">missed ${cnt}× · ${fmtDate(m.createdAt)}</span>

    </div>

  let list=DB.words.filter(w=>w.active);
  if(vocabState.q){const q=vocabState.q.toLowerCase();list=list.filter(w=>w.word.includes(q)||w.normalized.includes(q.replace(/[^a-z0-9]/g,""))||w.categories.some(c=>catName(c).toLowerCase().includes(q)))}

function downloadFile(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){
 const rows=[];let row=[],cell="",inQ=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(inQ){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}else cell+=ch}
  else if(ch==='"')inQ=true;
  else if(ch===","){row.push(cell);cell=""}
  else if(ch==="\n"||ch==="\r"){if(cell!==""||row.length){row.push(cell);rows.push(row);row=[];cell=""}}
  else cell+=ch;
 }
 if(cell!==""||row.length){row.push(cell);rows.push(row)}
 return rows;
}
function csvImportModal(done){
 modal("CSV Import",`<p class="small muted">Expected format: <code>word,meaning,example,category,difficulty</code> (with header row). Data is validated and duplicates detected before import — nothing is silently overwritten.</p>
 <label>Paste CSV or choose a file</label><textarea id="csv-t" rows="6" placeholder="word,meaning,example,category,difficulty"></textarea>
 <input type="file" id="csv-f" accept=".csv,text/csv" style="margin-top:8px"/>
 <div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="csv-ok">Preview & Import</button></div>`,()=>{
  $("#csv-f").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#csv-t").value=r.result;r.readAsText(f)});
  $("#csv-ok").onclick=()=>{
   const rows=parseCSV($("#csv-t").value).filter(r=>r.some(c=>c.trim()));
   if(!rows.length)return toast("No CSV data found.","err");
   const start=/^\s*word\s*,/i.test(rows[0].join(","))?1:0;
   const preview=[];
   for(let i=start;i<rows.length;i++){
    const[word,meaning,example,category,difficulty]=rows[i].map(c=>(c||"").trim());
    if(!word)continue;
    preview.push({word,meaning,example,category,difficulty:clamp(+difficulty||2,1,3),dup:DB.words.some(w=>w.normalized===normOf(word))});
   }
   modal(`Import Preview — ${preview.length} entries`,`
    <div class="row wrap small muted" style="margin-bottom:8px"><span class="chip neutral">${preview.length} entries</span><span class="chip difficult">${preview.filter(p=>p.dup).length} duplicates (skipped)</span><span class="chip mastered">${preview.filter(p=>!p.dup).length} ready to import</span></div>
    <div style="max-height:320px;overflow:auto"><table><thead><tr><th>Word</th><th>Category</th><th>Difficulty</th><th>Status</th></tr></thead><tbody>
    ${preview.slice(0,100).map(p=>`<tr><td><strong>${esc(p.word)}</strong></td><td class="small">${esc(p.category||"—")}</td><td>${p.difficulty}★</td><td>${p.dup?'<span class="chip difficult">duplicate — skipped</span>':'<span class="chip mastered">ready</span>'}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="imp-go">Import ${preview.filter(p=>!p.dup).length} Words</button></div>`,
   ()=>{$("#imp-go").onclick=()=>{
    let imported=0;
    for(const p of preview){
     if(p.dup)continue;
     let catId=null;
     if(p.category){let c=DB.categories.find(c=>c.name.toLowerCase()===p.category.toLowerCase());if(!c){c={id:uid(),name:p.category};DB.categories.push(c)}catId=c.id}
     DB.words.push({...newWord(p.word,catId?[catId]:[],"src_user"),meaning:p.meaning,example:p.example});
     imported++;
    }
    saveDB();closeModal();toast(`Vocabulary imported successfully (${imported} words).`,"ok");done&&done();
   }});
  };
 });
}

   ${statCard("x","Merged duplicates",m.mergedDupes??"—")}${statCard("check","Junction links",m.junctionLinks??"—")}
  </div>
  ${(m.sources||[]).map(r=>{const s=DB.sources.find(x=>x.id===r.sourceId)||{};return`<div class="small" style="margin-top:8px;padding:6px 0;border-bottom:1px solid var(--line)"><strong>${esc(s.name||r.sourceId)}</strong> — ${r.listed} listed · ${r.created} new canonical words · ${r.linked} cross-category links · ${r.dupInSrc} in-source duplicates merged</div>`}).join("")}
  <p class="small muted" style="margin-top:8px">${m.crossSourceLinks||0} words appear in both sources (single canonical record, attributed to both) · ${DB.words.filter(w=>w.needsReview).length} flagged needs_review · imported ${m.importedAt?fmtDate(m.importedAt):"—"}</p>
 </div>
 <div class="grid g4" style="margin-bottom:16px">
  ${statCard("user","Total users",DB.users.length)}${statCard("check","Active users",activeUsers)}
  ${statCard("play","Words practiced",totalAttempts)}${statCard("target","Average accuracy",acc+"%")}
 </div>
 <div class="grid g2">
  <div class="card pad"><h3>Most Missed Words</h3>${topMissed.length?topMissed.map(x=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><strong>${esc(x.w?x.w.display:"?")}</strong><span class="chip difficult">${x.c} misses</span></div>`).join(""):"<p class='small muted'>No mistake data yet.</p>"}</div>
  <div class="card pad"><h3>Most Common Mistake Types</h3>${topTypes.length?topTypes.map(([t,c])=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${ERRTYPES[t]||t}</span><span class="chip neutral">${c}</span></div>`).join(""):"<p class='small muted'>No mistake data yet.</p>"}</div>
  <div class="card pad"><h3>Most Popular Categories</h3>${topCats.length?topCats.map(c=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(c.n)}</span><span class="chip neutral">${c.c} attempts</span></div>`).join(""):"<p class='small muted'>No attempt data yet.</p>"}</div>
  <div class="card pad"><h3>Vocabulary by Source</h3>${Object.entries(bySource).map(([sid,c])=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc((DB.sources.find(s=>s.id===sid)||{}).name||sid)}</span><span class="chip neutral">${c} words</span></div>`).join("")}</div>
 </div>`;
}
let adminVocabState={q:"",page:1};
function adminVocab(v){
 const per=15;
 const render=()=>{
  let list=DB.words.filter(w=>adminVocabState.q?w.word.includes(adminVocabState.q.toLowerCase()):true);
  const pages=Math.max(1,Math.ceil(list.length/per));adminVocabState.page=clamp(adminVocabState.page,1,pages);
  const slice=list.slice((adminVocabState.page-1)*per,adminVocabState.page*per);
  v.innerHTML=`<div class="row spread wrap" style="margin-bottom:12px">
   <input id="av-q" placeholder="Search words…" style="max-width:280px" value="${esc(adminVocabState.q)}"/>
   <div class="row"><button class="btn" id="av-add">${ic("plus")} Add Word</button></div></div>
  <div class="card" style="overflow:auto"><table><thead><tr><th>Word</th><th>Category</th><th>Source</th><th>Diff</th><th>Status</th><th>Needs Review</th><th>Attempts</th><th></th></tr></thead><tbody>
  ${slice.map(w=>{const p=DB.progress[pkey(curUser().id,w.id)];
   return`<tr><td><strong>${esc(w.display)}</strong>${w.isMultiword?' <span class="chip neutral">phrase</span>':""}${w.isHyphenated?' <span class="chip neutral">hyph</span>':""}</td>
   <td class="small">${esc(w.categories.map(catName).join(", ")||"—")}</td><td class="small muted">${esc((DB.sources.find(s=>s.id===w.source)||{}).name||"—")}</td>
   <td>${w.difficulty}★</td><td>${w.active?'<span class="chip mastered">active</span>':'<span class="chip difficult">archived</span>'}</td>
   <td>${w.needsReview?'<span class="chip difficult">needs review</span>':"—"}</td>
   <td>${p?p.attempts:0}</td>
   <td class="row"><button class="btn" data-ae="${w.id}" aria-label="Edit">${ic("edit",15)}</button><button class="btn" data-aarch="${w.id}" aria-label="Archive">${ic("down",15)}</button><button class="btn danger" data-adel="${w.id}" aria-label="Delete">${ic("trash",15)}</button></td></tr>`}).join("")}
  </tbody></table></div>
  ${pages>1?`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="avp" ${adminVocabState.page<=1?"disabled":""}>←</button><span class="small muted" style="padding:0 10px">${adminVocabState.page} / ${pages}</span><button class="btn" id="avn" ${adminVocabState.page>=pages?"disabled":""}>→</button></div>`:""}`;
  $("#av-q").addEventListener("input",debounce(e=>{adminVocabState.q=e.target.value;adminVocabState.page=1;render()},200));
  $("#avp").onclick=()=>{adminVocabState.page--;render()};$("#avn").onclick=()=>{adminVocabState.page++;render()};
  $("#av-add").onclick=()=>wordForm(null,render);
  $$("[data-ae]").forEach(b=>b.onclick=()=>wordForm(wordById(b.dataset.ae),render));
  $$("[data-aarch]").forEach(b=>b.onclick=()=>{const w=wordById(b.dataset.aarch);w.active=!w.active;saveDB();toast(w.active?"Word restored.":"Word archived.");render()});
  $$("[data-adel]").forEach(b=>b.onclick=()=>{if(confirm("Permanently delete this word?")){DB.words=DB.words.filter(x=>x.id!==b.dataset.adel);saveDB();toast("Word deleted.");render()}});
 };
 render();
}
function wordForm(w,done){
 const isNew=!w;
 w=w||{display:"",categories:[],difficulty:2,source:"src_admin",meaning:"",example:"",pos:"",needsReview:false};
 modal(isNew?"Add Word":"Edit Word",`
  <label>Word / phrase</label><input id="wf-w" value="${esc(w.display)}" ${isNew?"":"readonly"}/>
  <label>Categories (Ctrl-click for multiple)</label><select id="wf-c" multiple size="5">${DB.categories.map(c=>`<option value="${c.id}" ${w.categories.includes(c.id)?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
  <div class="grid g2"><div><label>Difficulty (1–3)</label><input id="wf-d" type="number" min="1" max="3" value="${w.difficulty}"/></div>
  <div><label>Source</label><select id="wf-s">${DB.sources.map(s=>`<option value="${s.id}" ${w.source===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div></div>
  <label>Meaning <span class="muted">(enrichment — not from source PDF)</span></label><input id="wf-m" value="${esc(w.meaning)}"/>
  <label>Example sentence <span class="muted">(enrichment)</span></label><input id="wf-e" value="${esc(w.example)}"/>
  <label>Part of speech</label><input id="wf-p" value="${esc(w.pos)}" placeholder="noun, verb…"/>
  <label class="row" style="margin-top:12px"><input type="checkbox" id="wf-nr" ${w.needsReview?"checked":""} style="width:auto"/> Flag as needs_review</label>
  <div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="wf-ok">${isNew?"Add Word":"Save"}</button></div>`,
 ()=>{$("#wf-ok").onclick=()=>{
  const disp=$("#wf-w").value.trim();if(!disp)return toast("Word is required.","err");
  const cats=[...$("#wf-c").selectedOptions].map(o=>o.value);
  if(isNew){
   if(DB.words.some(x=>x.normalized===normOf(disp)))return toast("This word already exists in the database (duplicate).","err");
   DB.words.push({...newWord(disp,cats,"src_admin"),difficulty:+$("#wf-d").value||2,meaning:$("#wf-m").value.trim(),example:$("#wf-e").value.trim(),pos:$("#wf-p").value.trim(),needsReview:$("#wf-nr").checked});
  }else{
   w.categories=cats;w.difficulty=+$("#wf-d").value||2;w.source=$("#wf-s").value;w.meaning=$("#wf-m").value.trim();w.example=$("#wf-e").value.trim();w.pos=$("#wf-p").value.trim();w.needsReview=$("#wf-nr").checked;
  }
  saveDB();closeModal();toast(isNew?"Word added.":"Word saved.","ok");done();
 }});
}
function adminImport(v){
 v.innerHTML=`<div class="grid g2">
  <div class="card pad">
   <h3>${ic("upload")} PDF Import (additional sources)</h3>
   <p class="small muted" style="margin:8px 0">The initial vocabulary (${DB.words.length} words, ${DB.categories.length} categories) is already hard-coded from two PDF sources. You can upload another PDF here; text is extracted in-browser, categories detected, duplicates flagged, then <strong>you approve before anything is stored</strong>. Re-imports never create duplicate canonical words.</p>
   <input type="file" id="pdf-f" accept=".pdf,application/pdf"/>
   <div id="pdf-status" class="small muted" style="margin-top:8px"></div>
  </div>
  <div class="card pad">
   <h3>CSV / Text Import</h3>
   <p class="small muted" style="margin:8px 0">Import via CSV (<code>word,meaning,example,category,difficulty</code>) with full preview and validation.</p>
   <button class="btn primary" id="csv-go">Open CSV Import</button>
   <h3 style="margin-top:20px">Registered Sources</h3>
   ${DB.sources.map(s=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(s.name)}</strong><div class="small muted">${s.type}${s.fileName?" · "+esc(s.fileName):""}</div></div><span class="chip neutral">${DB.words.filter(w=>w.source===s.id).length} words</span></div>`).join("")}
  </div>
 </div>`;
 $("#csv-go").onclick=()=>csvImportModal(()=>vAdmin($("#view"),"admin","import"));
 $("#pdf-f").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const stat=$("#pdf-status");stat.textContent="Loading PDF engine…";
  try{
   if(!window.pdfjsLib){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
   }
   stat.textContent="Extracting text…";
   const buf=await f.arrayBuffer();
   const pdf=await pdfjsLib.getDocument({data:buf}).promise;
   let lines=[];
   for(let p=1;p<=pdf.numPages;p++){
    const tc=await pdf.getPage(p).getTextContent();
    let line="";for(const it of tc.items){line+=it.str;if(it.hasEOL){lines.push(line.trim());line=""}else line+=" "}
    if(line.trim())lines.push(line.trim());
   }
   stat.textContent="Analyzing entries…";
   showPdfPreview(pdfExtract(lines,f.name));
  }catch(err){console.error(err);stat.textContent="PDF engine could not load (offline?). Use CSV import instead — it works fully offline."}
 });
}
function pdfExtract(lines,fileName){
 const entries=[];let currentCat="";const seen=new Set();
 const listMarker=/^[\s]*(\d+[\.\)]|[-•*])\s*/;
 for(const raw of lines){
  let line=raw.replace(listMarker,"").replace(/\s{2,}/g," ").trim();
  if(!line||line.length<2)continue;
  if(/^(list of ielts listening( words)?|list of ielts)/i.test(line)){
   const m=line.match(/[-–]\s*([^:]+):?$/);if(m){currentCat=m[1].trim();continue}
  }
  const isHeading=/^[A-Z][^.!?]*:$/.test(line)||line.endsWith("Words:")||line.endsWith("Words -")||/^(4\.|2[0-9]\.|3[0-7]\.)\s*(List|Words)/.test(line);
  if(isHeading){const m=line.match(/[-–:]\s*([A-Za-z&/ ]+):?\s*$/);if(m)currentCat=m[1].trim();continue}
  let word=line.replace(/[.,;:]+$/,"").trim();
  if(!/^[A-Za-z][A-Za-z'\- /()]*$/.test(word)||word.length<2)continue;
  const key=normOf(word);
  const dupInFile=seen.has(key);seen.add(key);
  const dupDB=DB.words.some(w=>w.normalized===key);
  entries.push({word,category:currentCat,dupDB,hyphenated:/-/.test(word),multiword:/\s/.test(word),needsReview:word.length<3||dupInFile||NEEDS_REVIEW.has(word),status:dupDB?"duplicate":(word.length<3||NEEDS_REVIEW.has(word)?"review":"ready")});
 }
 return{entries,total:entries.length,unique:new Set(seen).size,cats:[...new Set(entries.map(e=>e.category).filter(Boolean))],fileName};
}
function showPdfPreview(p){
 modal(`Import Preview — ${p.fileName}`,`
  <div class="row wrap small" style="margin-bottom:10px">
   <span class="chip neutral">${p.total} extracted</span><span class="chip mastered">${p.unique} unique</span>
   <span class="chip difficult">${p.entries.filter(r=>r.dupDB).length} already in DB</span>
   <span class="chip new">${p.cats.length} categories detected</span>
   <span class="chip neutral">${p.entries.filter(r=>r.multiword).length} phrases</span>
   <span class="chip neutral">${p.entries.filter(r=>r.hyphenated).length} hyphenated</span>
   <span class="chip difficult">${p.entries.filter(r=>r.needsReview).length} needs review</span>
  </div>
  <label>Source name for attribution</label><input id="pv-src" value="${esc(p.fileName.replace(/\.pdf$/i,""))}"/>
  <div style="max-height:300px;overflow:auto;margin-top:10px"><table><thead><tr><th></th><th>Word</th><th>Category</th><th>Status</th></tr></thead><tbody>
  ${p.entries.slice(0,200).map((r,i)=>`<tr><td><input type="checkbox" class="pv-chk" data-i="${i}" ${r.status==="ready"?"checked":""} style="width:auto"/></td><td><strong>${esc(r.word)}</strong>${r.multiword?' <span class="chip neutral">phrase</span>':""}${r.hyphenated?' <span class="chip neutral">hyph</span>':""}</td><td class="small">${esc(r.category||"—")}</td><td>${r.status==="ready"?'<span class="chip mastered">ready</span>':r.status==="duplicate"?'<span class="chip difficult">duplicate</span>':'<span class="chip difficult">review</span>'}</td></tr>`).join("")}
  ${p.entries.length>200?`<tr><td colspan="4" class="small muted">…and ${p.entries.length-200} more (first 200 shown)</td></tr>`:""}
  </tbody></table></div>
  <div class="mfoot"><button class="btn" data-act="close-modal">Reject</button><button class="btn primary" id="pv-go">Import Selected</button></div>`,
 ()=>{
  $("#pv-go").onclick=()=>{
   let src=DB.sources.find(s=>s.name===$("#pv-src").value.trim());
   if(!src){src={id:uid(),name:$("#pv-src").value.trim(),type:"PDF",fileName:p.fileName,createdAt:Date.now()};DB.sources.push(src)}
   let imported=0,skipped=0;
   $$(".pv-chk").forEach(chk=>{if(!chk.checked)return;
    const r=p.entries[+chk.dataset.i];
    if(r.dupDB){skipped++;return}
    let catId=null;
    if(r.category){let c=DB.categories.find(c=>c.name.toLowerCase()===r.category.toLowerCase());if(!c){c={id:uid(),name:r.category};DB.categories.push(c)}catId=c.id}
    DB.words.push({...newWord(r.word,catId?[catId]:[],src.id),needsReview:r.needsReview});
    imported++;
   });
   saveDB();closeModal();toast(`Vocabulary imported successfully: ${imported} imported, ${skipped} skipped (duplicates).`,"ok");vAdmin($("#view"),"admin","import");
  };
 });
}
function adminAnalytics(v){
 const types={};DB.mistakes.forEach(m=>types[m.mistakeType]=(types[m.mistakeType]||0)+1);
 const labels=[],acc=[],vol=[];
 for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=todayISO(d);
  labels.push(d.getDate());const at=DB.attempts.filter(a=>todayISO(a.createdAt)===k);
  acc.push(Math.round(pct(at.filter(a=>a.isCorrect).length,at.length)));vol.push(at.length)}
 v.innerHTML=`<div class="grid g2">
  <div class="card pad"><h3>Platform Accuracy (14 days, all users)</h3><canvas id="ac1"></canvas></div>
  <div class="card pad"><h3>Attempt Volume</h3><canvas id="ac2"></canvas></div>
  <div class="card pad"><h3>Mistake Type Distribution</h3>${Object.keys(types).length?`<canvas id="ac3"></canvas>`:`<p class="small muted">No mistakes recorded yet.</p>`}</div>
  <div class="card pad"><h3>Needs Review Queue</h3>
   ${DB.words.filter(w=>w.needsReview).length?DB.words.filter(w=>w.needsReview).slice(0,10).map(w=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><strong>${esc(w.display)}</strong><button class="btn" data-clear="${w.id}">Mark reviewed</button></div>`).join(""):`<p class="small muted">No entries flagged for review. 🎉</p>`}
  </div>
 </div>`;
 drawLine($("#ac1"),labels,acc);
 drawBars($("#ac2"),labels,vol);
 if(Object.keys(types).length)drawBars($("#ac3"),Object.keys(types).map(t=>(ERRTYPES[t]||t).split(" ")[0]),Object.values(types),getCSS("--bad"));
 $$("[data-clear]").forEach(b=>b.onclick=()=>{wordById(b.dataset.clear).needsReview=false;saveDB();toast("Marked as reviewed.","ok");vAdmin($("#view"),"admin","analytics")});
}

window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
loadDB();
